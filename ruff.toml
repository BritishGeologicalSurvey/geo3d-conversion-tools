# Set the target Python version (Use py312 or py313 as the closest target for 3.14 env)
target-version = "py313"
 
line-length = 120

# Global exclusions so Ruff doesn't scan build artifacts or environments
exclude = [
    ".venv",
    "standard-test-env",
    "build",
    "dist",
    ".git",
    "__pycache__",
]

# Exclude some specific files/dirs
extend-exclude = [
    "**/generated_*.py", # autogenerated
    "**/notebooks", #not BGS code
]
force-exclude = true

[lint]
# Enable Pyflakes (F), pycodestyle (E), isort (I), and pyupgrade (UP)
select = ["E", "F", "I", "UP", "D"]
ignore = [
    "D202", # No blank lines allowed after function docstring 
    "D205", # No blank lines allowed after summary 
]

# Allow Ruff to automatically fix issues it finds
fixable = ["ALL"]

[format]
# Use double quotes for strings, spaces for indents (standard Python style)
quote-style = "double"
indent-style = "space"

[lint.pydocstyle]
# Enforce Google-style docstrings
convention = "google" # 